services:
  postgres:
    image: postgres:17
    container_name: postgres_container
    env_file:
      - ../configs/.env
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -w -v ON_ERROR_STOP=1 -c 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_net
  
  server:
    container_name: server
    build:
      context: ..
      dockerfile: build/package/server/Dockerfile
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    env_file:
      - ../configs/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net
    develop:
      watch:
        - path: ../internal
          action: rebuild
        - path: ../pkg
          action: rebuild
        - path: ../build/package/server
          action: rebuild
        - path: ../congigs
          action: rebuild
        - path: ../cmd
          action: rebuild
        - path: ../deployments/docker-compose.yml
          action: rebuild


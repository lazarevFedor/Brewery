  nginx:
    container_name: nginx
    build:
      context: ..
      dockerfile: build/package/nginx/Dockerfile
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - app_net

volumes:
  pgdata:
  prometheus_data:
  grafana_data:

networks:
  app_net:
    driver: bridge

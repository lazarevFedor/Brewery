services:
  postgres:
    image: postgres:17
    container_name: postgres_container
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data/PGdata
  
  server:
    container_name: server
    build:
      context: ..
      dockerfile: build/package/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    depends_on:
      - postgres

volumes:
  pgdata:

name: build.yml
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          mkdir deployments/pgdata
          docker compose -f deployments/docker-compose.yml --env-file configs/env.example up -d --build server